# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: ApnaSassy
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  GameCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ApnaSassy:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ApnaSassy
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "अपना सैसी"
        DEVELOPMENT_LANGUAGE: hi
        INFOPLIST_KEY_CFBundleDevelopmentRegion: hi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.platform-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
        CODE_SIGN_STYLE: Automatic
