# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: CallAssistant
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CallAssistant:
    type: application
    platform: iOS
    sources: [CallAssistant]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CallAssistant
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Call Assistant
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: CallAssistant/Resources/CallAssistant.entitlements
        CODE_SIGN_STYLE: Automatic
    info:
      path: CallAssistant/Resources/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
