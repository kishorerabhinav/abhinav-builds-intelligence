name: Apna Sassy web app

# Publishes the home-screen (PWA) version to GitHub Pages via the gh-pages branch.
on:
  push:
    paths:
      - "apna-sassy/web/**"
      - "apna-sassy/docs/app-icon.png"
      - ".github/workflows/apna-sassy-web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the web app
        run: |
          pip install pillow
          python apna-sassy/web/build_pwa.py

      - name: Push to gh-pages
        working-directory: apna-sassy/web/site
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish Apna Sassy web app from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
