<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Abhinav's extension</title>
<style>
/* Popup: one column, a switch row up top, then the server, then which sites. */
:root {
  --bg: #f6f7f4;
  --panel: #ffffff;
  --fg: #1f2a24;
  --muted: #5f6d65;
  --line: #d9dfda;
  --accent: #1f7a5a;
  --accent-fg: #ffffff;
  --warn: #b4442b;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161c19; --panel: #1f2723; --fg: #e6ece8; --muted: #9aa8a0; --line: #33403a;
    --accent: #4cc28f; --accent-fg: #0d1712; --warn: #ff8a6e; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { width: 340px; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--sans); }
header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header img { width: 28px; height: 28px; }
header h1 { font-size: 16px; margin: 0; }
header .state { font-size: 12px; color: var(--muted); }
.switch { margin-left: auto; position: relative; width: 44px; height: 24px; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 12px; background: var(--line); transition: background 120ms; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,0.3); transition: transform 120ms; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
main { display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 16px; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
legend { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
label { display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: 12px; }
.row { display: grid; grid-template-columns: 92px 1fr 72px; gap: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
input[type=text], input[type=password], input[type=number], select, textarea {
  font: 13px var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0;
}
textarea { font-family: var(--mono); font-size: 12px; resize: vertical; min-height: 84px; }
input.missing, textarea.missing { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.modes { display: flex; gap: 6px; }
.modes label { flex: 1; flex-direction: row; align-items: center; gap: 6px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); cursor: pointer; }
.modes label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.actions { display: flex; gap: 8px; }
button { font: 600 13px var(--sans); border-radius: 6px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); margin-left: auto; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.error { font-size: 12px; color: var(--warn); margin: 0; }
</style>
</head>
<body>
<header>
  <img src="icons/on-48.png" alt="">
  <div>
    <h1>Abhinav's extension</h1>
    <div class="state" id="state">Off</div>
  </div>
  <div class="switch">
    <input type="checkbox" id="enabled" aria-label="Use the proxy">
    <span></span>
  </div>
</header>

<main>
  <fieldset>
    <legend>Proxy server</legend>
    <div class="row">
      <label>Type
        <select id="scheme">
          <option value="http">HTTP</option>
          <option value="https">HTTPS</option>
          <option value="socks5">SOCKS5</option>
        </select>
      </label>
      <label>Address <input type="text" id="host" placeholder="proxy.example.com" spellcheck="false"></label>
      <label>Port <input type="number" id="port" min="1" max="65535" placeholder="8080"></label>
    </div>
    <div class="row2">
      <label>Username <input type="text" id="username" placeholder="optional" spellcheck="false" autocomplete="off"></label>
      <label>Password <input type="password" id="password" placeholder="optional" autocomplete="off"></label>
    </div>
    <p class="note" id="socksNote" hidden>Chrome can't send a username and password to SOCKS proxies. Use one without a login, or an HTTP proxy.</p>
  </fieldset>

  <fieldset>
    <legend>Which sites</legend>
    <div class="modes">
      <label><input type="radio" name="mode" value="list" id="modeList"> Only these sites</label>
      <label><input type="radio" name="mode" value="all" id="modeAll"> Every site</label>
    </div>
    <label id="sitesLabel">One site per line. Subdomains are included.
      <textarea id="sites" spellcheck="false" placeholder="example.com&#10;news.example.org"></textarea>
    </label>
    <button type="button" id="addCurrent">Add this tab's site</button>
  </fieldset>

  <p class="error" id="error" hidden></p>
  <div class="actions">
    <p class="note" id="saved" role="status"></p>
    <button type="button" class="primary" id="save">Save</button>
  </div>
</main>

<script type="module" src="popup.js"></script>
</body>
</html>
